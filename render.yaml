services:
  - type: web
    name: mamacare-api
    runtime: node
    buildCommand: npm install && npx tsc --project tsconfig.server.json
    startCommand: node dist/server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CORS_ORIGINS
        sync: false
